<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f3a5f"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Inventario de ropa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213a;--mute:#6b7690;--line:#dde2ec;--main:#1f3a5f;--on:#fff;--stitch:#e0a526;--low:#c0392b;--lowbg:#fde8e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1523;--card:#172238;--ink:#e8edf7;--mute:#93a0ba;--line:#2a3856;--main:#7fa6dd;--on:#0e1523;--lowbg:#3a1d1d;--low:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0e1523;--card:#172238;--ink:#e8edf7;--mute:#93a0ba;--line:#2a3856;--main:#7fa6dd;--on:#0e1523;--lowbg:#3a1d1d;--low:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
h1{margin:0;font-size:26px;font-weight:800}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.bar{display:flex;gap:8px;max-width:760px;margin:8px auto;padding:0 16px;flex-wrap:wrap}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
.bar input{flex:1 1 160px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--main);color:var(--on);font-weight:600}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--stitch);outline-offset:1px}
main{max-width:760px;margin:auto;padding:8px 16px 90px;display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:84px 1fr;gap:12px}
.ph{width:84px;height:104px;border-radius:8px;background:var(--bg) center/cover;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center}
.top{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:800;font-size:17px}
.meta{color:var(--mute);font-size:13px}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sz{border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;min-width:64px}
.sz.low{background:var(--lowbg);border-color:var(--low)}
.sz b{display:block;font-size:12px;color:var(--mute)}
.sz.low b{color:var(--low)}
.st{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:17px}
.st button{padding:0;width:26px;height:26px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:16px;line-height:1}
.acts{display:flex;gap:8px;margin-top:10px}
